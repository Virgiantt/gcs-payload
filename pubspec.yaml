name: gcs_cansat
description: Ground Control Station — Flutter Desktop
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.0
  window_manager: ^0.4.2
  google_fonts: ^6.2.1
  ffi: ^2.2.0
  dart_periphery: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icons/eepisat.png"
  android: false
  ios: false
  windows:
    generate: true
    image_path: "assets/icons/eepisat.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/models/
    - assets/models/
